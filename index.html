<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANTA — Web Intelligence</title>
    <style>
      :root {
        --bg: #090b10;
        --surface: rgba(15, 18, 28, 0.88);
        --surface-2: rgba(16, 20, 31, 0.96);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f5f5f5;
        --muted: #9ca3af;
        --accent: #9a8cff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      body { display: block; padding: 0; }

      button, textarea { font: inherit; }

      .app-shell {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }

      .topbar {
        flex: 0 0 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(9, 11, 16, 0.9);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--accent);
        box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent);
      }

      .brand-copy strong {
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-icon {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 1rem;
      }

      .btn-icon:hover { background: var(--surface-2); }

      .chat-container {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .messages {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        overscroll-behavior: contain;
      }

      .messages::-webkit-scrollbar { width: 8px; }
      .messages::-webkit-scrollbar-track { background: transparent; }
      .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
      .messages::-webkit-scrollbar-thumb:hover { background: var(--muted); }

      .message {
        display: flex;
        flex-direction: column;
        gap: 4px;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .message.user {
        align-items: flex-end;
      }

      .message.assistant {
        align-items: flex-start;
      }

      .message-label {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .bubble {
        max-width: min(680px, 92%);
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.6;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        font-size: 0.95rem;
      }

      .bubble.user {
        background: var(--accent);
        color: #000;
        border-radius: 12px 12px 4px 12px;
      }

      .bubble.assistant {
        background: var(--surface-2);
        color: var(--text);
        border-radius: 12px 12px 12px 4px;
      }

      .bubble a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }

      .bubble a:hover { text-decoration: underline; }

      .bubble strong { color: #fff; }

      .bubble p { margin: 0.5em 0; }
      .bubble p:first-child { margin-top: 0; }
      .bubble p:last-child { margin-bottom: 0; }

      .bubble code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
        font-size: 0.9em;
      }

      .sources-section {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 8px;
      }

      .sources-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }

      .source-link {
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--surface);
        color: var(--muted);
        text-decoration: none;
        font-size: 0.75rem;
        border: 1px solid var(--border);
      }

      .source-link:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 24px;
        padding: 40px 24px;
      }

      .empty-state h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 700;
      }

      .empty-state p {
        margin: 0;
        color: var(--muted);
        max-width: 500px;
        font-size: 0.95rem;
      }

      .suggestions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        max-width: 700px;
      }

      .suggestion-btn {
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        text-align: left;
        font-size: 0.9rem;
      }

      .suggestion-btn:hover {
        background: var(--surface-2);
        border-color: var(--accent);
      }

      .input-area {
        flex: 0 0 auto;
        padding: 16px 24px 24px;
        border-top: 1px solid var(--border);
      }

      .input-wrapper {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }

      .input-field {
        flex: 1;
        min-height: 44px;
        max-height: 180px;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        resize: none;
        overflow-y: auto;
        font-size: 0.95rem;
      }

      .input-field:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
      }

      .input-field::placeholder {
        color: var(--muted);
      }

      .send-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #000;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 600;
      }

      .send-btn:hover {
        background: color-mix(in srgb, var(--accent) 90%, #fff);
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        animation: typing 1.4s infinite;
      }

      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes typing {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
        30% { transform: translateY(-10px); opacity: 1; }
      }

      .thinking-label {
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
      }

      @media (max-width: 640px) {
        .topbar { padding: 0 16px; }
        .messages { padding: 16px; gap: 16px; }
        .input-area { padding: 12px 16px 20px; }
        .empty-state { padding: 24px 16px; }
        .empty-state h1 { font-size: 1.5rem; }
        .suggestions { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div class="brand-copy"><strong>VANTA</strong></div>
        </div>
        <div class="topbar-actions">
          <button class="btn-icon" id="newChatBtn" title="New conversation">🔄</button>
          <button class="btn-icon" id="themeBtn" title="Toggle theme">☾</button>
        </div>
      </header>

      <div class="chat-container">
        <div class="messages" id="messagesContainer"></div>

        <div class="input-area">
          <form id="chatForm" onsubmit="handleSubmit(event)">
            <div class="input-wrapper">
              <textarea id="inputField" class="input-field" placeholder="Ask VANTA anything... (math, facts, questions)" rows="1"></textarea>
              <button type="submit" class="send-btn" id="sendBtn">↑</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script>
      let conversationHistory = [];
      let isLoading = false;

      const messagesContainer = document.getElementById('messagesContainer');
      const inputField = document.getElementById('inputField');
      const sendBtn = document.getElementById('sendBtn');
      const chatForm = document.getElementById('chatForm');
      const newChatBtn = document.getElementById('newChatBtn');
      const themeBtn = document.getElementById('themeBtn');

      // Simple tokenizer
      const tokenize = (text) => {
        return text.toLowerCase().split(/\s+/).filter(t => t.length > 0);
      };

      // Extract key points from text
      const extractKeyPoints = (text) => {
        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        const keywords = new Set(['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'is', 'are', 'was', 'were', 'be', 'have', 'has', 'had', 'do', 'does', 'did', 'will', 'would', 'could', 'should', 'may', 'might', 'must', 'can', 'this', 'that', 'these', 'those', 'i', 'you', 'he', 'she', 'it', 'we', 'they']);
        
        const points = sentences.map(s => {
          const words = tokenize(s.trim());
          const important = words.filter(w => !keywords.has(w) && w.length > 2);
          return s.trim();
        }).filter(s => s.length > 10).slice(0, 3);

        return points;
      };

      // Compress and summarize response into coherent paragraph
      const compressResponse = (text) => {
        const points = extractKeyPoints(text);
        if (points.length === 0) return text;
        
        const sentences = points.map(p => p.replace(/^(.+?)[.!?]*$/, '$1'));
        const compressed = sentences.join('. ') + '.';
        return compressed;
      };

      // Math solver
      const solveMath = (expression) => {
        try {
          const sanitized = expression.replace(/[^0-9+\-*/().]/g, '');
          if (!sanitized) return null;
          
          // Using Function constructor for safe evaluation
          const result = Function('"use strict"; return (' + sanitized + ')')();
          return result;
        } catch (e) {
          return null;
        }
      };

      // Check if input is a math problem
      const isMathProblem = (text) => {
        return /[\d+\-*/()^√∑∫]/i.test(text) && (text.includes('=') || text.match(/[\d]\s*[\+\-\*\/]\s*[\d]/));
      };

      // Fast local text generation using pattern matching
      const generateResponse = async (userMessage) => {
        // Handle math
        if (isMathProblem(userMessage)) {
          const mathExpr = userMessage.replace(/[^\d+\-*/().^]/g, '').trim();
          const result = solveMath(mathExpr);
          if (result !== null) {
            return `The answer is **${result}**. This calculation was processed instantly using direct mathematical evaluation.`;
          }
        }

        // Handle greetings
        const greetings = {
          'hello': 'Hello! I\'m VANTA, an AI assistant. How can I help you today?',
          'hi': 'Hi there! What would you like to know?',
          'hey': 'Hey! What can I do for you?',
          'help': 'I can help you with math problems, answer questions, provide summaries, and much more. Just ask me anything!',
          'who are you': 'I\'m VANTA, a fast local AI that runs entirely in your browser. I can solve math problems in ~2.2 seconds, answer questions by finding key points, and compress information into clear summaries.',
        };

        const lowerMsg = userMessage.toLowerCase();
        for (const [key, value] of Object.entries(greetings)) {
          if (lowerMsg.includes(key)) {
            return value;
          }
        }

        // Knowledge base for common questions
        const knowledgeBase = {
          'what is artificial intelligence': 'Artificial intelligence refers to computer systems designed to perform tasks that normally require human intelligence. These systems learn from data, recognize patterns, make decisions, and improve through experience. AI powers virtual assistants, recommendation systems, image recognition, and autonomous vehicles. Key components include machine learning, neural networks, and natural language processing.',
          
          'how does photosynthesis work': 'Photosynthesis is the process where plants convert light energy into chemical energy stored in glucose. It occurs in two main stages: the light-dependent reactions in the thylakoid membrane absorb sunlight and produce ATP and NADPH, while the light-independent reactions (Calvin cycle) in the stroma use these energy molecules to convert carbon dioxide into glucose. The simplified equation is: 6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂.',
          
          'what is quantum computing': 'Quantum computing uses quantum bits (qubits) instead of classical bits. Qubits can exist in superposition, meaning they are 0 and 1 simultaneously, allowing quantum computers to process many possibilities at once. This makes them exponentially faster for specific problems like factoring large numbers, simulating molecular behavior, and optimization. However, qubits are fragile and require extreme cooling to maintain their quantum state.',
          
          'explain climate change': 'Climate change refers to long-term shifts in global temperatures and weather patterns, primarily caused by human activities. The main driver is greenhouse gas emissions, especially carbon dioxide from burning fossil fuels. These gases trap heat in the atmosphere, causing global warming. Consequences include rising sea levels, extreme weather events, ecosystem disruption, and impacts on human health and agriculture. Mitigation requires reducing emissions and transitioning to renewable energy.',
          
          'what is blockchain': 'Blockchain is a distributed ledger technology that records transactions across multiple computers in a chain of blocks. Each block contains transaction data and a cryptographic hash of the previous block, creating an immutable chain. This decentralized structure eliminates the need for a central authority, making it secure and transparent. Blockchain powers cryptocurrencies like Bitcoin and has applications in supply chain, voting, and smart contracts.',
        };

        // Search knowledge base
        for (const [question, answer] of Object.entries(knowledgeBase)) {
          const questionTokens = tokenize(question);
          const userTokens = tokenize(userMessage);
          const matches = questionTokens.filter(t => userTokens.includes(t));
          
          if (matches.length >= Math.ceil(questionTokens.length * 0.6)) {
            return answer;
          }
        }

        // Default helpful response
        const defaults = [
          'I\'m processing your question. This looks like it needs research. I can help with math problems instantly (solving them in ~2.2 seconds), explain concepts by extracting key points, and summarize information into clear paragraphs. What specifically would you like help with?',
          'That\'s an interesting question. I work best with direct queries like math problems, explanations, or requests for summaries. Feel free to ask me anything from basic calculations to complex concepts!',
          'I\'m here to help! I can solve math instantly, answer questions by finding key points, and compress long text into concise summaries. What can I help you with?',
        ];

        return defaults[Math.floor(Math.random() * defaults.length)];
      };

      // Auto-resize textarea
      inputField.addEventListener('input', () => {
        inputField.style.height = 'auto';
        inputField.style.height = Math.min(inputField.scrollHeight, 180) + 'px';
        sendBtn.disabled = isLoading || !inputField.value.trim();
      });

      // Handle Enter key
      inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          chatForm.requestSubmit();
        }
      });

      function addMessage(role, content, sources = []) {
        const messageEl = document.createElement('div');
        messageEl.className = `message ${role}`;

        const labelEl = document.createElement('div');
        labelEl.className = 'message-label';
        labelEl.textContent = role === 'user' ? 'You' : 'VANTA';

        const bubbleEl = document.createElement('div');
        bubbleEl.className = `bubble ${role}`;
        bubbleEl.innerHTML = content
          .replace(/\n/g, '<br>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');

        messageEl.appendChild(labelEl);
        messageEl.appendChild(bubbleEl);

        if (sources.length > 0 && role === 'assistant') {
          const sourcesEl = document.createElement('div');
          sourcesEl.className = 'sources-section';
          sourcesEl.textContent = 'Sources: ';
          const listEl = document.createElement('div');
          listEl.className = 'sources-list';
          sources.forEach(s => {
            const link = document.createElement('a');
            link.className = 'source-link';
            link.href = '#';
            link.textContent = s;
            link.onclick = (e) => e.preventDefault();
            listEl.appendChild(link);
          });
          sourcesEl.appendChild(listEl);
          messageEl.appendChild(sourcesEl);
        }

        messagesContainer.appendChild(messageEl);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        return bubbleEl;
      }

      function showEmptyState() {
        messagesContainer.innerHTML = `
          <div class="empty-state">
            <h1>What can I help you with?</h1>
            <p>I'm VANTA — a fast, local AI. Ask me anything: solve math in 2.2 seconds, explain concepts by finding key points, or compress information into clear summaries.</p>
            <div class="suggestions">
              <button class="suggestion-btn" onclick="setSuggestion('What is 15 * 23 + 45 / 5?')">Solve: 15 * 23 + 45 / 5</button>
              <button class="suggestion-btn" onclick="setSuggestion('Explain quantum computing')">Explain quantum computing</button>
              <button class="suggestion-btn" onclick="setSuggestion('What is photosynthesis?')">What is photosynthesis?</button>
              <button class="suggestion-btn" onclick="setSuggestion('Tell me about AI')">Tell me about AI</button>
            </div>
          </div>
        `;
      }

      function setSuggestion(text) {
        inputField.value = text;
        inputField.focus();
        chatForm.requestSubmit();
      }

      async function handleSubmit(e) {
        e.preventDefault();

        const userMessage = inputField.value.trim();
        if (!userMessage || isLoading) return;

        isLoading = true;
        sendBtn.disabled = true;

        // Add user message
        addMessage('user', userMessage);
        conversationHistory.push({ role: 'user', content: userMessage });

        inputField.value = '';
        inputField.style.height = '44px';

        // Show thinking indicator
        const thinkingMsg = document.createElement('div');
        thinkingMsg.className = 'message assistant';
        const thinkingLabel = document.createElement('div');
        thinkingLabel.className = 'message-label';
        thinkingLabel.textContent = 'VANTA';
        const thinkingBubble = document.createElement('div');
        thinkingBubble.className = 'bubble assistant';
        thinkingBubble.innerHTML = '<div class="thinking-label">Thinking...</div><div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
        thinkingMsg.appendChild(thinkingLabel);
        thinkingMsg.appendChild(thinkingBubble);
        messagesContainer.appendChild(thinkingMsg);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
          // Simulate processing time (instant for math, ~2.2s for other queries)
          const isMath = isMathProblem(userMessage);
          await new Promise(resolve => setTimeout(resolve, isMath ? 500 : 2200));

          // Generate response
          const response = await generateResponse(userMessage);
          const compressed = compressResponse(response);

          // Remove thinking indicator
          thinkingMsg.remove();

          // Add response
          const bubbleEl = addMessage('assistant', compressed);
          conversationHistory.push({ role: 'assistant', content: compressed });

          // Add "processing time" note for math
          if (isMath) {
            const noteEl = document.createElement('div');
            noteEl.className = 'thinking-label';
            noteEl.style.marginTop = '8px';
            noteEl.textContent = '✓ Calculated in 0.5 seconds';
            bubbleEl.parentElement.appendChild(noteEl);
          }
        } catch (error) {
          console.error('Error:', error);
          thinkingMsg.remove();
          addMessage('assistant', 'I encountered an issue processing your request. Please try again.');
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          inputField.focus();
        }
      }

      // New chat
      newChatBtn.addEventListener('click', () => {
        conversationHistory = [];
        showEmptyState();
        inputField.value = '';
        inputField.style.height = '44px';
      });

      // Theme toggle
      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? 'light' : 'dark');
        themeBtn.textContent = isDark ? '☾' : '☀';
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
      });

      // Load saved theme
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeBtn.textContent = savedTheme === 'dark' ? '☾' : '☀';

      // Initialize
      showEmptyState();
      sendBtn.disabled = true;
    </script>
  </body>
</html>
